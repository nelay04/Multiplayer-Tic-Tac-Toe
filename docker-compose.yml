services:
  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        PORT: ${PORT}
    env_file:
      - .env
    ports:
      - "127.0.0.1:${PORT}:${PORT}"
    restart: unless-stopped
    # Room for the graceful shutdown to flush in-flight writes before SIGKILL.
    stop_grace_period: 30s
